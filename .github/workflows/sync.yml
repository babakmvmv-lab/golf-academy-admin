name: Publish the original admin panel on its own host
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh shared assets without changing the original admin pages
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/babakmvmv-lab/golf-academy-pro.git /tmp/main
          python3 tools/sync_admin_host.py /tmp/main
          git diff --check

      - name: Commit if changed
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || (git commit -m "sync: refresh original admin host assets" && git push)
