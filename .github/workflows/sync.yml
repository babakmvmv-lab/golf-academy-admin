name: Publish the ops panel on this host
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish (shop workspace at the root, site CMS under /site/)
        run: |
          set -e
          git clone --depth 1 https://github.com/babakmvmv-lab/golf-academy-pro.git /tmp/main

          # This host is the operations panel only — it must not keep a second copy of the public
          # storefront pages (shop/checkout/product/academy/login/panel). Everything that is not the
          # panel, the CNAME or this repo's own files gets rebuilt from the main repo each run.
          # .git must survive: when it was deleted here once, every later step died with
          # "fatal: not in a git directory" and the mirror silently served a stale panel for weeks.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name '.github' ! -name 'CNAME' ! -name 'README.md' \
            ! -name 'index.html' ! -name 'login.html' ! -name 'site' ! -name '404.html' ! -name 'cine.css' ! -name 'tools' \
            -exec rm -rf {} +
          touch .nojekyll

          # Panel shell + everything it loads by absolute path.
          # The site CMS document may come back from the main repo; it lands in /site/ and NEVER in '.'
          # — copying it onto the root is what used to bury the shop workspace here (the root is this
          # host's own dashboard document, and a blind `cp -r …/. .` would replace it with the CMS page).
          if [ -f /tmp/main/admin/site/index.html ]; then
            mkdir -p site
            cp -r /tmp/main/admin/site/. site/
            echo "took the site CMS document from the main repo into /site/"
          else
            echo "admin/site/ is gone from the main repo — keeping this repo's own /site/ shell and refreshing only the assets."
          fi
          for item in _next images data favicon.ico enter-academy.js; do
            [ -e "/tmp/main/$item" ] && cp -r "/tmp/main/$item" .
          done
          cp /tmp/main/site-cloud.*.js . 2>/dev/null || true
          cp /tmp/main/shop-ops.*.js . 2>/dev/null || true
          cp /tmp/main/source/public-cloud-manifest.json . 2>/dev/null || true

          # Point both hand-written pages at whatever the current hashed bootstrap is, so the shell
          # keeps working after the main repo stops carrying admin/.
          python3 - <<'PY'
          import json,glob,pathlib,re
          root=pathlib.Path('.')
          man={}
          if (root/'public-cloud-manifest.json').exists():
              man=json.loads((root/'public-cloud-manifest.json').read_text())
          boot=man.get('bootstrap') or ''
          shop=man.get('shopOpsAsset') or ''
          index=root/'index.html'
          # fall back to what the shell already asks for, if the manifest is missing
          if not boot and index.exists():
              m=re.search(r'site-cloud\.[0-9a-f]+\.js',index.read_text(encoding='utf-8'))
              boot=m.group(0) if m else ''
          if not boot:
              hits=sorted(p.name for p in root.glob('site-cloud.*.js'))
              boot=hits[-1] if hits else ''
          if not shop:
              hits=sorted(p.name for p in root.glob('shop-ops.*.js'))
              shop=hits[-1] if hits else ''
          if not boot or not shop: raise SystemExit('nothing to point the shell at (no bootstrap/shop-ops assets)')
          for page in ('index.html','site/index.html','login.html'):
              p=root/page
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              new=re.sub(r'site-cloud\.[0-9a-f]+\.js',boot,s)
              # the main repo renames every adapted chunk per build; follow it so the shell never
              # points at a pc-* file that no longer exists on this host
              for original,renamed in (man.get('chunks') or {}).items():
                  new=re.sub(r'pc-[0-9a-f]{12}-'+re.escape(original),renamed,new)
                  new=re.sub(r'(?<![-\w])'+re.escape(original),renamed,new)
              if new!=s: p.write_text(new,encoding='utf-8'); print(f'{page}: refreshed asset names')
              if page in ('index.html','site/index.html'):
                  # both panel documents have to be able to sign you back in on their own: shop-ops only
                  # reads an existing session, and the widget that used to offer the form is hidden there.
                  # The block is STRIPPED and rewritten every run — these pages are committed back into the
                  # repo, so "keep it if present" freezes the first version forever (that is how a /site/
                  # visitor ended up sent to '/' after signing in: an old guard with no next= was kept).
                  new=re.sub(r'\s*<!-- admin-login-guard -->.*?</script>','',new,flags=re.S)
                  nxt = '%2F' if page=='index.html' else '%2Fsite%2F'
                  new=new.replace('</body>',
                    '  <!-- admin-login-guard -->\n  <script>(function(){try{var C=window.PC_SITE_CLOUD;'
                    'var s=C&&C.authSession&&C.authSession();if(!(s&&s.access_token))location.replace(\'/login.html?next='
                    + nxt + '\');}catch(e){}})();</script>\n</body>',1)
                  p.write_text(new,encoding='utf-8'); print(page+': login guard rewritten (next=' + nxt + ')')

          # One-line notices, so nothing that was ever linked dies on a 404. /admin is the important one:
          # the exported login card links «پنل فروشگاه» to /admin (_next/static/chunks/12lzqn_~_d9qf.js
          # @5033) and «پنل سایت» to /admin/site (@5297) — both are the documents themselves now one level
          # up, so the notices hop to / and /site/ rather than to a nested path.
          for legacy, where in (('admin', '/'), ('admin/site', '/site/'), ('admin/login', '/login.html?next=%2F')):
              d=root/legacy
              d.mkdir(parents=True,exist_ok=True)
              (d/'index.html').write_text(
                '<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">'
                '<meta name="robots" content="noindex"><title>پنل مدیریت جابه‌جا شد</title>'
                f'<meta http-equiv="refresh" content="0; url={where}"></head>'
                f'<body><p>این مسیر جابه‌جا شد — در حال بازکردن… <a href="{where}">ادامه</a></p>'
                f'<script>location.replace("{where}");</script></body></html>\n',encoding='utf-8')
          # the public pages of the main site are not this host's job
          (root/'404.html').write_text(
            '<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">'
            '<meta name="robots" content="noindex"><title>پات کلاب</title>'
            '<meta http-equiv="refresh" content="0; url=https://puttclub.ir/"></head>'
            '<body><script>location.replace("https://puttclub.ir/");</script></body></html>\n',encoding='utf-8')
          (root/'robots.txt').write_text('User-agent: *\nDisallow: /\n',encoding='utf-8')
          PY

          # The cinematic backdrop is this host's own styling: one file, both pages, no network calls.
          # These two lines must stay OUTSIDE the python heredoc above — inside it they are a SyntaxError
          # (run #12 died exactly that way), which is also how the step silently skipped its tail.
          python3 tools/cine.py --check
          python3 tools/cine.py inject

          # Refuse to publish a broken shell rather than lock yourself out.
          test -f index.html || { echo '::error=no panel shell (index.html) — refusing to publish'; exit 1; }
          test -f login.html || { echo '::error=no login.html — refusing to publish'; exit 1; }
          BOOT=$(grep -o 'site-cloud\.[0-9a-f]*\.js' index.html | head -1)
          test -n "$BOOT" -a -f "$BOOT" || { echo "::error=index.html points at a missing bootstrap ($BOOT)"; exit 1; }
          grep -q "$BOOT" login.html || { echo "::error=login.html points at a different bootstrap than index.html"; exit 1; }
          grep -q "$BOOT" site/index.html || { echo "::error=/site/ points at a different bootstrap than the root"; exit 1; }
          SHOP=$(grep -o 'shop-ops\.[0-9a-f]*\.js' "$BOOT" | head -1)
          test -n "$SHOP" -a -f "$SHOP" || { echo "::error=bootstrap points at a missing shop-ops asset ($SHOP)"; exit 1; }
          # the root IS the shop workspace now: it must stay the exported dashboard document with its
          # workspace chunk and a bootstrap to refresh (a silent swap back to the CMS page is what this
          # host looked like for weeks — the title and the chunk are how we notice)
          grep -q 'داشبورد مدیر' index.html || { echo '::error=index.html is not the shop dashboard document'; exit 1; }
          grep -q '0s294n3n15ion.js' index.html || { echo '::error=the dashboard lost its workspace chunk'; exit 1; }
          grep -q 'site-cloud\.' index.html || { echo '::error=the dashboard has no bootstrap reference to refresh'; exit 1; }
          test -f site/index.html || { echo '::error=no /site/ CMS document — refusing to publish'; exit 1; }
          grep -q 'مدیریت سایت' site/index.html || { echo '::error=site/index.html is not the site CMS document'; exit 1; }
          python3 tools/cine.py verify
          grep -q backupView2 "$SHOP" || echo "::warning::the mirrored shop-ops has no backupView2 — the backup screen may not be published yet"
          python3 - <<'PY'
          # every static file this host's own pages ask for must exist here, or the panel loads half
          # a screen (that is exactly what a copy-list drift does)
          import pathlib,re
          bad=[]
          for page in ('index.html','site/index.html','login.html'):
              text=pathlib.Path(page).read_text(encoding='utf-8')
              for ref in set(re.findall(r'(?:src|href)="(/[^"?#]+\.(?:js|css|ico|png|jpe?g|svg|woff2?))"',text)):
                  if not pathlib.Path('.'+ref).exists(): bad.append(f'{page} → {ref}')
          if bad: raise SystemExit('dangling references:\n  '+'\n  '.join(sorted(bad)))
          print('static references: all present')
          PY

      - name: Commit if changed
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || (git commit -m "sync: publish ops panel from golf-academy-pro" && git push)
