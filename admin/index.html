<style id="admin-shell-css">
:root{color-scheme:dark;--a-bg:#06110d;--a-card:#102119;--a-card2:#142a20;--a-line:#d0bd8630;--a-gold:#ddc07c;--a-text:#f0eee4;--a-muted:#93aa9c;--a-green:#66d49d;--a-head-h:112px}
*{box-sizing:border-box}
html{min-height:100%;background:var(--a-bg);scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:transparent;color:var(--a-text);font:14px/1.85 Vazirmatn,"Vazirmatn FD",Tahoma,system-ui,sans-serif}
button,a{font:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--a-gold);outline-offset:3px}
#admin-shell-header{position:relative;z-index:2;border-bottom:1px solid var(--a-line);background:linear-gradient(115deg,rgba(8,24,17,.97),rgba(5,15,11,.97));box-shadow:0 10px 30px #0002;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.admin-shell-inner{width:min(1500px,100%);margin:auto;padding:12px clamp(12px,3vw,30px);display:grid;grid-template-columns:minmax(180px,1fr) auto;align-items:center;gap:12px}
.admin-brand{display:flex;align-items:center;gap:11px;min-width:0;color:var(--a-text);text-decoration:none}
.admin-brand img{width:42px;height:42px;flex:none;object-fit:contain;padding:3px;border-radius:12px;background:#f2ecdd;border:1px solid #ddc07c55}
.admin-brand-copy{min-width:0;display:flex;flex-direction:column;line-height:1.55}
.admin-brand-copy strong{font-size:15px;font-weight:850;white-space:nowrap}
.admin-brand-copy small{color:var(--a-muted);font-size:10.5px}
.admin-sections{display:grid;grid-template-columns:repeat(2,minmax(140px,1fr));gap:8px}
.admin-sections button{min-height:44px;padding:8px 15px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--a-line);border-radius:12px;background:#ffffff05;color:#c8d6cc;font-size:13px;font-weight:750;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.admin-sections button:hover{background:#ffffff0b;color:#fff;border-color:#ddc07c66}
.admin-sections button[aria-current="page"]{background:linear-gradient(120deg,#d9bb71,#c49b42);border-color:#ead69c;color:#101a12;box-shadow:0 5px 16px #c9a24b24}
.admin-sections .admin-icon{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.admin-sections svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#admin-shell-main{width:min(1500px,100%);margin:0 auto;padding:clamp(14px,2.6vw,28px)}
body #pc-site-cloud{display:none!important}
#admin-home{min-height:calc(100dvh - var(--a-head-h) - 56px);display:grid;place-items:center;text-align:center;padding:34px 18px}
.admin-home-card{width:min(620px,100%);padding:clamp(24px,5vw,44px);border:1px solid var(--a-line);border-radius:22px;background:linear-gradient(145deg,rgba(17,39,28,.90),rgba(7,19,14,.94));box-shadow:0 24px 80px #0004}
.admin-home-mark{width:58px;height:58px;margin:0 auto 16px;display:grid;place-items:center;border:1px solid #ddc07c60;border-radius:18px;background:#ddc07c12;color:var(--a-gold)}
.admin-home-mark svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.admin-home-card h1{margin:0 0 8px;font-size:clamp(20px,4vw,27px);line-height:1.6}
.admin-home-card p{margin:0;color:var(--a-muted);font-size:13px}
#admin-site-workspace,#admin-store-workspace{min-width:0}
#admin-site-frame{display:block;width:100%;height:calc(100dvh - var(--a-head-h));min-height:640px;border:0;border-radius:14px;background:#06110d;color:var(--a-text)}
#shop-ops{--sh-bg:#07130f;min-height:100dvh!important;border:1px solid var(--a-line);border-radius:16px;overflow:clip}
.admin-load-error{max-width:720px;margin:24px auto;padding:20px;border-radius:14px;border:1px solid #c46a6955;background:#58222430;color:#f0c2bd;line-height:2}
.admin-load-error h2{margin:0 0 5px;font-size:16px}
.admin-load-error button{margin-top:10px;padding:8px 14px;border-radius:9px;border:1px solid #ddc07c55;background:#ddc07c;color:#101a12;font-weight:800;cursor:pointer}
#admin-site-workspace[hidden],#admin-store-workspace[hidden],#admin-home[hidden]{display:none!important}
@media(max-width:700px){
 :root{--a-head-h:124px}
 .admin-shell-inner{grid-template-columns:minmax(0,1fr);gap:10px;padding:10px 12px}
 .admin-brand img{width:36px;height:36px;border-radius:10px}
 .admin-brand-copy strong{font-size:14px}
 .admin-brand-copy small{font-size:10px}
 .admin-sections{width:100%;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
 .admin-sections button{min-width:0;min-height:44px;padding:8px 7px;font-size:12px;gap:6px}
 #admin-shell-main{padding:12px 9px}
 #admin-home{min-height:calc(100dvh - var(--a-head-h) - 24px);padding:18px 8px}
 .admin-home-card{border-radius:17px}
 #admin-site-frame{height:calc(100dvh - var(--a-head-h));min-height:72dvh;border-radius:10px}
 #shop-ops{border-radius:11px}
}
@media(max-width:360px){.admin-sections button{font-size:11px;padding-inline:4px}.admin-brand-copy small{font-size:9px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
</style>
<script id="admin-shell-boot">
(function(){try{var q=new URLSearchParams(location.search);var s=q.get('section');document.documentElement.setAttribute('data-admin-view',s==='site'?'site':s==='store'?'store':'home');}catch(e){document.documentElement.setAttribute('data-admin-view','home');}})();
</script>
<style>
html[data-admin-view="site"] #admin-home,html[data-admin-view="store"] #admin-home{display:none!important}
html[data-admin-view="site"] #admin-site-workspace{display:block!important}
html[data-admin-view="store"] #admin-store-workspace{display:block!important}
</style>
<!-- admin-login-guard -->
<script id="admin-login-guard">
(function(){try{var C=window.PC_SITE_CLOUD;if(!C||typeof C.authSession!=='function')return;var s=C.authSession();if(s&&s.access_token)return;var section=new URLSearchParams(location.search).get('section');var next='/admin/'+(section==='site'?'?section=site':section==='store'?'?section=store':'');location.replace('/login.html?next='+encodeURIComponent(next));}catch(e){}})();
</script>
</head>
<body>
<header id="admin-shell-header">
 <div class="admin-shell-inner">
  <a class="admin-brand" href="/admin/" aria-label="بازگشت به پنل مدیریت پات‌کلاب">
   <img src="/images/academy-logo.jpg" alt="">
   <span class="admin-brand-copy"><strong>پنل مدیریت پات‌کلاب</strong><small>دسترسی یکپارچه به مدیریت سایت و فروشگاه</small></span>
  </a>
  <nav class="admin-sections" aria-label="بخش‌های پنل مدیریت">
   <button type="button" data-admin-section="site" aria-current="false"><span class="admin-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18M8 9v11"></path></svg></span>مدیریت سایت</button>
   <button type="button" data-admin-section="store" aria-current="false"><span class="admin-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 9h18l-1.4-5H4.4L3 9Z"></path><path d="M5 9v11h14V9M9 20v-6h6v6M3 9c0 1.6 1.1 2.6 2.5 2.6S8 10.6 8 9c0 1.6 1.1 2.6 2.5 2.6S13 10.6 13 9c0 1.6 1.1 2.6 2.5 2.6S18 10.6 18 9c0 1.6 1.1 2.6 2.5 2.6S23 10.6 23 9"></path></svg></span>مدیریت فروشگاه</button>
  </nav>
 </div>
</header>
<main id="admin-shell-main">
 <section id="admin-home" aria-labelledby="admin-welcome-title">
  <div class="admin-home-card">
   <div class="admin-home-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 16l3-8 3 8M8 13h5M15 5h4v11h-4zM17 2v3"></path></svg></div>
   <h1 id="admin-welcome-title">پنل مدیریت پات‌کلاب</h1>
   <p>برای ورود به یکی از دو فضای مدیریتی، گزینهٔ مربوط را از نوار بالا انتخاب کنید.</p>
  </div>
 </section>
 <section id="admin-site-workspace" hidden aria-label="مدیریت سایت">
  <iframe id="admin-site-frame" title="مدیریت سایت پات‌کلاب" loading="lazy" referrerpolicy="same-origin" allow="clipboard-read; clipboard-write"></iframe>
 </section>
 <section id="admin-store-workspace" hidden aria-label="مدیریت فروشگاه">
  <div id="admin-store-load-error" hidden class="admin-load-error" role="alert" aria-live="polite"></div>
  <div id="shop-ops"></div>
 </section>
</main>
<script id="admin-shell-controller">
(function(){
 var html=document.documentElement, sitePanel=document.getElementById('admin-site-workspace'),storePanel=document.getElementById('admin-store-workspace'),home=document.getElementById('admin-home'),frame=document.getElementById('admin-site-frame'),shop=document.getElementById('shop-ops'),errorBox=document.getElementById('admin-store-load-error');
 var mounted=false,frameStarted=false,header=document.getElementById('admin-shell-header');
 function setHeadHeight(){if(header)document.documentElement.style.setProperty('--a-head-h',Math.ceil(header.getBoundingClientRect().height)+'px');}
 setHeadHeight();if(header&&window.ResizeObserver)new ResizeObserver(setHeadHeight).observe(header);window.addEventListener('resize',setHeadHeight);
 function current(){var x=new URLSearchParams(location.search).get('section');return x==='site'?'site':x==='store'?'store':'home';}
 function setSection(section,write){
  if(!['home','site','store'].includes(section))section='home';
  html.setAttribute('data-admin-view',section);
  home.hidden=section!=='home';sitePanel.hidden=section!=='site';storePanel.hidden=section!=='store';
  document.querySelectorAll('[data-admin-section]').forEach(function(b){var on=b.dataset.adminSection===section;b.setAttribute('aria-current',on?'page':'false');});
  if(section==='site'&&!frameStarted){frameStarted=true;frame.src='/admin/site/';}
  if(section==='store'){document.body.dataset.panelSection='store';document.body.dataset.shopOps='1';mountStore();}else{document.body.dataset.panelSection=section;delete document.body.dataset.shopOps;}
  if(write){var url=section==='site'?'/admin/?section=site':section==='store'?'/admin/?section=store':'/admin/';history.replaceState({adminSection:section},'',url);}
 }
 function mountStore(){
  if(mounted||!shop)return;
  mounted=true;errorBox.hidden=true;
  shop.innerHTML='<div class="admin-load-error"><h2>در حال باز کردن فضای مدیریت فروشگاه…</h2><span>لطفاً چند لحظه صبر کنید.</span></div>';
  var C=window.PC_SITE_CLOUD;
  if(!C||typeof C.loadShopOps!=='function'){
   mounted=false;errorBox.hidden=false;errorBox.innerHTML='<h2>اتصال پنل فروشگاه آماده نیست</h2><div>فایل اصلی پنل بارگذاری نشده است؛ صفحه را تازه کنید.</div><button type="button" data-admin-retry>تلاش دوباره</button>';shop.innerHTML='';return;
  }
  C.loadShopOps().then(function(){if(!window.SHOP_OPS||typeof window.SHOP_OPS.mount!=='function')throw new Error('پنل فروشگاه کامل بارگذاری نشد.');return window.SHOP_OPS.mount(shop);}).catch(function(e){mounted=false;shop.innerHTML='';errorBox.hidden=false;var message=String(e&&e.message||'خطای بارگذاری پنل').replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c];});errorBox.innerHTML='<h2>فضای فروشگاه باز نشد</h2><div>'+message+'</div><button type="button" data-admin-retry>تلاش دوباره</button>';});
 }
 document.querySelectorAll('[data-admin-section]').forEach(function(b){b.addEventListener('click',function(){setSection(b.dataset.adminSection,true);});});
 document.getElementById('admin-shell-header').addEventListener('click',function(e){var brand=e.target.closest('.admin-brand');if(brand){e.preventDefault();setSection('home',true);}});
 errorBox.addEventListener('click',function(e){if(e.target.closest('[data-admin-retry]')){mounted=false;mountStore();}});
 document.addEventListener('click',function(e){
  var a=e.target.closest('a[href]');if(!a)return;
  var href=a.getAttribute('href')||'';
  if(/^\/admin\/site\/?(?:[?#].*)?$/.test(href)){e.preventDefault();e.stopImmediatePropagation();setSection('site',true);return;}
  if(href==='/login.html?next=%2F'){e.preventDefault();e.stopImmediatePropagation();location.href='/login.html?next=%2Fadmin%2F%3Fsection%3Dstore';return;}
  if(href==='/'&&a.closest('.sh-side-links')){e.preventDefault();e.stopImmediatePropagation();window.open('https://puttclub.ir/','_blank','noopener');}
 },true);
 window.addEventListener('message',function(e){if(e.origin!==location.origin||e.source!==frame.contentWindow||!e.data||e.data.type!=='puttclub-admin-frame-height')return;var h=Number(e.data.height);if(Number.isFinite(h)&&h>100)frame.style.height=Math.min(Math.max(h,640),200000)+'px';});
 var initial=current();setSection(initial,false);
})();
</script>

<!-- ga-cinematic -->
<style id="ga-cinematic">/* ══════════════════════════════════════════════════════════════════════════
   ga cinematic backdrop — فقط برای همین هاست (admin.puttclub.ir)
   .github/workflows/sync.yml همین فایل را داخل index.html و login.html تزریق می‌کند
   (بلوک میان دو مارکر شروع/پایانِ ga-cinematic در صفحه تزریق می‌شود؛ برای برداشتنش همین فایل را از workflow خارج کن).
   هیچ درخواست شبکه‌ای ندارد: نقش‌ها data-URI اند، پس با هاست نیمه‌قطعی هم کار می‌کند.
   the two SVG roles are generated by tools/cine.py.
   ══════════════════════════════════════════════════════════════════════════ */
html{background:#030b08}
body{background:transparent!important}

#ga-cine{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(115% 72% at 84% -14%,rgba(201,162,75,.20),transparent 57%),
    radial-gradient(98% 66% at 6% 108%,rgba(23,84,62,.55),transparent 62%),
    radial-gradient(70% 46% at 50% 52%,rgba(9,26,19,0),rgba(1,6,5,.62) 100%),
    linear-gradient(163deg,#072016 0%,#04120d 44%,#020a09 100%)}
#ga-cine>span{position:absolute;inset:-26%;display:block}
/* نور پروژکتور مسابقه: درخشش طلایی که خیلی آرام می‌چرخد */
#ga-cine .ga-bloom{background:conic-gradient(from 210deg at 62% 36%,
    rgba(206,171,86,.13),transparent 21%,rgba(37,110,84,.17) 47%,transparent 71%,rgba(206,171,86,.10));
  filter:blur(80px) saturate(120%);animation:ga-drift 54s linear infinite}
/* خطوط زمین، دوردست، که نفس می‌کشد */
#ga-cine .ga-fairway{inset:auto 0 0 0;height:78%;opacity:.13;background-repeat:no-repeat;
  background-position:50% 100%;background-size:min(1650px,142%) auto;background-image:url("data:image/svg+xml,%3Csvg%20xmlns=%22http:%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox=%220%200%201600%20700%22%20width=%221600%22%20height=%22700%22%3E%3Cpath%20d=%22M0%20138%20C%20260%20102,%20520%20150.6,%20800%20120%20S%201340%2096.6,%201600%20130.8%22%20stroke=%22%23c9a24b%22%20stroke-opacity=%220.3%22%20stroke-width=%221.6%22%20fill=%22none%22%2F%3E%3Cpath%20d=%22M0%20204%20C%20260%20160,%20520%20219.4,%20800%20182%20S%201340%20153.4,%201600%20195.2%22%20stroke=%22%23c9a24b%22%20stroke-opacity=%220.275%22%20stroke-width=%221%22%20fill=%22none%22%2F%3E%3Cpath%20d=%22M0%20270%20C%20260%20218,%20520%20288.2,%20800%20244%20S%201340%20210.2,%201600%20259.6%22%20stroke=%22%23c9a24b%22%20stroke-opacity=%220.25%22%20stroke-width=%221%22%20fill=%22none%22%2F%3E%3Cpath%20d=%22M0%20336%20C%20260%20276,%20520%20357.0,%20800%20306%20S%201340%20267.0,%201600%20324.0%22%20stroke=%22%23c9a24b%22%20stroke-opacity=%220.225%22%20stroke-width=%221.6%22%20fill=%22none%22%2F%3E%3Cpath%20d=%22M0%20402%20C%20260%20334,%20520%20425.8,%20800%20368%20S%201340%20323.8,%201600%20388.4%22%20stroke=%22%23c9a24b%22%20stroke-opacity=%220.2%22%20stroke-width=%221%22%20fill=%22none%22%2F%3E%3Cpath%20d=%22M0%20468%20C%20260%20392,%20520%20494.6,%20800%20430%20S%201340%20380.6,%201600%20452.8%22%20stroke=%22%23c9a24b%22%20stroke-opacity=%220.175%22%20stroke-width=%221%22%20fill=%22none%22%2F%3E%3Cpath%20d=%22M0%20534%20C%20260%20450,%20520%20563.4,%20800%20492%20S%201340%20437.4,%201600%20517.2%22%20stroke=%22%23c9a24b%22%20stroke-opacity=%220.15%22%20stroke-width=%221.6%22%20fill=%22none%22%2F%3E%3Cpath%20d=%22M0%20600%20C%20260%20508,%20520%20632.2,%20800%20554%20S%201340%20494.2,%201600%20581.6%22%20stroke=%22%23c9a24b%22%20stroke-opacity=%220.125%22%20stroke-width=%221%22%20fill=%22none%22%2F%3E%3Cpath%20d=%22M0%20666%20C%20260%20566,%20520%20701.0,%20800%20616%20S%201340%20551.0,%201600%20646.0%22%20stroke=%22%23c9a24b%22%20stroke-opacity=%220.1%22%20stroke-width=%221%22%20fill=%22none%22%2F%3E%3Ccircle%20cx=%221180%22%20cy=%22150%22%20r=%222.6%22%20fill=%22%23f0dfa8%22%20fill-opacity=%22.85%22%2F%3E%3Cpath%20d=%22M1180%20150%20L1180%2096%20L1210%20108%20L1180%20120%22%20fill=%22%23c9a24b%22%20fill-opacity=%22.55%22%2F%3E%3C%2Fsvg%3E");
  -webkit-mask-image:radial-gradient(76% 68% at 50% 74%,#000 18%,transparent 80%);
          mask-image:radial-gradient(76% 68% at 50% 74%,#000 18%,transparent 80%);
  animation:ga-breathe 30s ease-in-out infinite}
#ga-cine .ga-grain{inset:0;opacity:.05;mix-blend-mode:overlay;background-size:170px 170px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns=%22http:%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width=%22170%22%20height=%22170%22%3E%3Cfilter%20id=%22n%22%3E%3CfeTurbulence%20type=%22fractalNoise%22%20baseFrequency=%220.86%22%20numOctaves=%223%22%20stitchTiles=%22stitch%22%2F%3E%3CfeColorMatrix%20type=%22saturate%22%20values=%220%22%2F%3E%3C%2Ffilter%3E%3Crect%20width=%22170%22%20height=%22170%22%20filter=%22url(%23n)%22%20opacity=%22.55%22%2F%3E%3C%2Fsvg%3E")}
#ga-cine .ga-vign{inset:0;background:radial-gradient(122% 92% at 50% 44%,transparent 42%,rgba(0,0,0,.52) 100%)}
@keyframes ga-drift{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.06)}100%{transform:rotate(360deg) scale(1)}}
@keyframes ga-breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.4%) scale(1.025)}}

/* برنامه باید رو‌ی لایه بیاید */
#shop-ops,body>main{position:relative;z-index:1}

/* پنل: کارتها شیشه‌ای می‌شوند تا پس‌زمینه حس شود؛ به رنگ متن دست نمی‌زنیم تا خوانایی نپرد */
body[data-shop-ops="1"] #shop-ops{background:transparent!important}
body[data-shop-ops="1"] .sh-side{background:linear-gradient(180deg,rgba(6,19,14,.86),rgba(3,11,8,.93))!important;
  -webkit-backdrop-filter:blur(14px) saturate(115%);backdrop-filter:blur(14px) saturate(115%)}
body[data-shop-ops="1"] .sh-card,body[data-shop-ops="1"] .sh-kpi,body[data-shop-ops="1"] .sh-quick button{
  background:linear-gradient(130deg,rgba(21,44,33,.80),rgba(12,28,21,.86))!important;
  -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px)}
body[data-shop-ops="1"] .sh-top{background:linear-gradient(120deg,rgba(10,26,19,.72),rgba(5,16,12,.80))!important;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
body[data-shop-ops="1"] .sh-table tr:hover td{background:rgba(201,162,75,.055)!important}

@media (prefers-reduced-motion:reduce){#ga-cine *,#ga-cine>span{animation:none!important}}
@media print{#ga-cine{display:none!important}body{background:#fff!important}}
</style>
<div id="ga-cine" aria-hidden="true"><span class="ga-bloom"></span><span class="ga-fairway"></span><span class="ga-grain"></span><span class="ga-vign"></span></div>
